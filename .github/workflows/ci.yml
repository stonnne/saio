name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check scholaraio/ tests/
      - run: ruff format --check scholaraio/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy scholaraio/

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - run: python -m venv .venv-wheel
      - run: .venv-wheel/bin/pip install dist/*.whl
      - run: .venv-wheel/bin/pip check
      - run: .venv-wheel/bin/python -c "import importlib.metadata, importlib.util, scholaraio; assert scholaraio.__version__ == importlib.metadata.version('scholaraio'); assert importlib.util.find_spec('mineru_open_api') is None"
      - run: .venv-wheel/bin/scholaraio --help

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,office]"
      - run: pytest --cov --cov-report=term-missing
